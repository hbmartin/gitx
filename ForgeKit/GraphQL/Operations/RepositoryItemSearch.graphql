query GitHubRepositoryItemSearch($query: String!, $first: Int!, $after: String) {
  search(query: $query, type: ISSUE, first: $first, after: $after) {
    totalCount: issueCount
    pageInfo {
      ...GitHubPageInfo
    }
    nodes {
      ... on PullRequest {
        ...GitHubPullRequestSummary
      }
      ... on Issue {
        ...GitHubIssueSummary
      }
    }
  }
}
