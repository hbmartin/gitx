query GitHubPullRequestList(
  $owner: String!
  $name: String!
  $first: Int!
  $after: String
  $states: [PullRequestState!]
) {
  repository(owner: $owner, name: $name) {
    id
    pullRequests(
      first: $first
      after: $after
      states: $states
      orderBy: { field: UPDATED_AT, direction: DESC }
    ) {
      totalCount
      pageInfo {
        ...GitHubPageInfo
      }
      nodes {
        ...GitHubPullRequestSummary
      }
    }
  }
}
