mutation GitHubEnterMergeQueue($input: EnqueuePullRequestInput!) {
  enqueuePullRequest(input: $input) {
    mergeQueueEntry {
      id
      pullRequest {
        id
        number
        headRefOid
        repository {
          ...GitHubRepositoryIdentity
        }
      }
    }
  }
}

