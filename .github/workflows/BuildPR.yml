name: pull request

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-smoke:
    name: dependency and toolchain smoke
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Prepare ObjectiveGit
        run: |
          cd External/objective-git
          script/bootstrap
          script/update_libgit2
      - name: Compile the dependency and toolchain smoke lane
        run: scripts/xcodebuild.sh --run-id "buildpr-smoke-${{ github.run_id }}-${{ github.run_attempt }}" smoke
      - name: Upload smoke receipt and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GitX-build-smoke-verification
          path: |
            artifacts/verification/buildpr-smoke-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            artifacts/verification/buildpr-smoke-${{ github.run_id }}-${{ github.run_attempt }}/Logs

  build-gitx:
    name: build
    needs: toolchain-smoke
    permissions:
      contents: read
    env:
      variableSet: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      UI_RUN_ID: buildpr-ui-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.abi }}
      ARCHIVE_RUN_ID: buildpr-archive-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.abi }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: 26.6
            runner: macos-26
            abi: arm64
    steps:
      - name: ls Xcode
        run: ls -la /Applications/Xcode*
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Install the Apple certificate and provisioning profile
        if: ${{ env.variableSet != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.provisionprofile"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # apply provisioning profile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PP_PATH" "$PROFILE_DIR"
      - name: Show openssl version
        run: |
          openssl version
          # Remove stale configuration before uninstalling so Homebrew stays quiet.
          rm -rf /usr/local/etc/openssl@1.1 /usr/local/etc/openssl@3
          rm -rf /opt/homebrew/etc/openssl@1.1 /opt/homebrew/etc/openssl@3
          brew uninstall --ignore-dependencies openssl
          brew install openssl@3
          openssl version
      - name: pre build
        run: cd External/objective-git && script/bootstrap && script/update_libgit2 && cd ../..
      - name: Show openssl version
        run: |
          openssl version
      - name: Unlink openssl 3
        run: |
          brew unlink openssl@3
          
      # Test (only on arm64 to avoid tripling CI time)
      - name: Run tests
        id: ui-tests
        if: ${{ matrix.abi == 'arm64' && github.event_name == 'pull_request' }}
        run: |
          scripts/xcodebuild.sh --run-id "$UI_RUN_ID" test ui \
            --destination "platform=macOS,arch=${{ matrix.abi }}" \
            ARCHS="${{ matrix.abi }}"
      - name: Extract screenshots from test results
        if: ${{ !cancelled() && steps.ui-tests.outcome != 'skipped' && steps.ui-tests.outcome != '' && hashFiles(format('artifacts/verification/{0}/Results/GitXUI.xcresult/Info.plist', env.UI_RUN_ID)) != '' }}
        run: |
          python3 scripts/extract_screenshots.py \
            "artifacts/verification/$UI_RUN_ID/Results/GitXUI.xcresult" \
            ./scripts/screenshots-${{ matrix.abi }}
      - name: Upload screenshots
        if: ${{ !cancelled() && hashFiles(format('scripts/screenshots-{0}/**/*.png', matrix.abi)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Screenshots-${{ matrix.abi }}
          path: ./scripts/screenshots-${{ matrix.abi }}/*.png
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
      - name: Build project
        # Do not pass PRODUCT_BUNDLE_IDENTIFIER on the command line: it would
        # override every target in the workspace, including Sparkle's embedded
        # Updater.app, which would then claim the app's identifier and break
        # any lookup that resolves GitX that way. Each target already sets its
        # own identifier in the project file, and the step below fails the
        # build if two bundles ever share one.
        run: |
          signing_settings=()
          if [[ -z "$variableSet" ]]; then
            signing_settings=(
              CODE_SIGNING_ALLOWED=NO
              CODE_SIGNING_REQUIRED=NO
              CODE_SIGN_IDENTITY=""
            )
          fi
          scripts/xcodebuild.sh --run-id "$ARCHIVE_RUN_ID" archive \
            --destination "platform=macOS,arch=${{ matrix.abi }}" \
            ARCHS="${{ matrix.abi }}" \
            "${signing_settings[@]}"
      - name: Verify archived bundle identifiers
        run: python3 scripts/check_bundle_identifiers.py "artifacts/verification/$ARCHIVE_RUN_ID/Products/GitX.xcarchive/Products/Applications/Half Dark.app"
      - name: Export signed app
        if: ${{ env.variableSet != '' }}
        env:
          EXPORT_OPTIONS: ${{ secrets.NOTARY_EXPORT_OPTIONS }}
        run: |
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          ARCHIVE_PATH="artifacts/verification/$ARCHIVE_RUN_ID/Products/GitX.xcarchive"
          EXPORT_PATH="artifacts/verification/$ARCHIVE_RUN_ID/Products/Export"
          echo -n "$EXPORT_OPTIONS" > "$EXPORT_OPTIONS_PATH"
          echo "EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS_PATH"
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist "$EXPORT_OPTIONS_PATH"
      - name: Notarize App
        if: ${{ env.variableSet != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          APP_PATH="artifacts/verification/$ARCHIVE_RUN_ID/Products/Export/Half Dark.app"
          ZIP_PATH="artifacts/verification/$ARCHIVE_RUN_ID/Products/notarization.zip"
          NOTARY_LOG_DIRECTORY="artifacts/verification/$ARCHIVE_RUN_ID/Logs"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          scripts/notarize_distribution.sh "$ZIP_PATH" "$NOTARY_LOG_DIRECTORY"
      - name: Staple Notarization
        if: ${{ env.variableSet != '' }}
        run: |
          APP_PATH="artifacts/verification/$ARCHIVE_RUN_ID/Products/Export/Half Dark.app"
          xcrun stapler staple "$APP_PATH"
      - name: Package and verify distributed app payloads
        id: package
        if: ${{ env.variableSet != '' }}
        run: |
          scripts/package_distribution.sh \
            "artifacts/verification/$ARCHIVE_RUN_ID/Products/Export/Half Dark.app" \
            "$GITHUB_WORKSPACE" "${{ matrix.abi }}" --outputs "$GITHUB_OUTPUT"
      - name: Upload verification receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GitX-build-verification-${{ matrix.abi }}
          path: |
            artifacts/verification/*/receipt.json
            artifacts/verification/*/Logs
            artifacts/verification/*/Results
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ success() && env.variableSet != '' }}
        with:
          name: HalfDark-${{ matrix.abi }}-distribution
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}
      - name: Clean up keychain and provisioning profile
        if: ${{ env.variableSet != '' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db"
          rm "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.provisionprofile"
  
  release:
    if: startsWith(github.event.ref, 'refs/tags/') && github.repository == 'gitx/gitx'
    needs: build-gitx
    permissions:
      contents: write
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Find Tag
        id: tagger
        uses: jimschubert/query-tag-action@ebe504c35d1ea44d7272c8eccc7a71e2e4f1b1cb # v2
        with:
          skip-unshallow: 'true'
          abbrev: false
          commit-ish: HEAD
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: HalfDark-arm64-distribution
          path: distribution
      - name: Check pre-release
        env:
          RELEASE_TAG: ${{ steps.tagger.outputs.tag }}
        run: |
          echo "tag=$RELEASE_TAG"
          if [[ "$RELEASE_TAG" == *alpha* || "$RELEASE_TAG" == *beta* ]]
          then
             prerelease=true
          else
             prerelease=false
          fi
          echo "PRE_RELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "prerelease=$prerelease"
      - name: Create Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{steps.tagger.outputs.tag}}
          generate_release_notes: true
          prerelease: ${{ env.PRE_RELEASE }}
          name: ${{steps.tagger.outputs.tag}}
          files: |
            distribution/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: update Sparkle
        if: ${{ env.PRE_RELEASE == 'false' }}
        env:
          CLASSIC_TOKEN: ${{ secrets.CLASSIC_TOKEN }}
        run: curl -u "$GITHUB_ACTOR:$CLASSIC_TOKEN" -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Checkout brew repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ secrets.PERSONALACCESSTOKEN }}
          repository: Homebrew/homebrew-cask.git
          path: brew
          persist-credentials: false
          ref: main
      - name: Update Homebrew cask
        env:
          RELEASE_TAG: ${{ steps.tagger.outputs.tag }}
        run: |
          shaarm64=$(shasum -a 256 HalfDark-arm64.dmg | cut -d " " -f1)
          echo "arm64 sha256=$shaarm64"
          cat > brew/Casks/g/gitx.rb <<EOF
          cask "gitx" do
            version "$RELEASE_TAG"
            sha256 "$shaarm64"

            url "https://github.com/gitx/gitx/releases/download/#{version}/HalfDark-arm64.dmg"
            name "Half Dark"
            desc "Git GUI"
            homepage "https://github.com/gitx/gitx"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on arch: :arm64
            depends_on macos: :ventura

            app "Half Dark.app"
            binary "#{appdir}/Half Dark.app/Contents/Resources/gitx"

            zap trash: [
              "~/Library/Application Support/com.apple.sharedfilelist/com.apple.LSSharedFileList.ApplicationRecentDocuments/nl.frim.gitx.sfl*",
              "~/Library/Caches/nl.frim.GitX",
              "~/Library/Caches/me.haroldmartin.HalfDark",
              "~/Library/Preferences/nl.frim.GitX.plist",
              "~/Library/Preferences/me.haroldmartin.HalfDark.plist",
              "~/Library/Saved Application State/nl.frim.GitX.savedState",
              "~/Library/Saved Application State/me.haroldmartin.HalfDark.savedState",
            ]
          end
          EOF
          cat brew/Casks/g/gitx.rb
      - name: Create Pull Request in brew https://github.com/Homebrew/homebrew-cask
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        if: ${{ env.PRE_RELEASE == 'false' }}
        with:
          path: ${{ github.workspace }}/brew
          commit-message: Bump gitx ${{ steps.tagger.outputs.tag }}
          title: Bump gitx ${{ steps.tagger.outputs.tag }}
          body: Bump gitx to ${{ steps.tagger.outputs.tag }}
          token: ${{ secrets.PERSONALACCESSTOKEN }}
          push-to-fork: hannesa2/homebrew-cask
          branch: bump-gitx-${{ steps.tagger.outputs.tag }}
          base: main
