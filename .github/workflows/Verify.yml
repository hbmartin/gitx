name: verify

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-smoke:
    name: dependency and toolchain smoke
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Prepare ObjectiveGit
        run: |
          cd External/objective-git
          script/bootstrap
          script/update_libgit2
      - name: Compile the dependency and toolchain smoke lane
        run: scripts/xcodebuild.sh --run-id "verify-smoke-${{ github.run_id }}-${{ github.run_attempt }}" smoke
      - name: Upload smoke receipt and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GitX-smoke-verification
          path: |
            artifacts/verification/verify-smoke-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            artifacts/verification/verify-smoke-${{ github.run_id }}-${{ github.run_attempt }}/Logs

  core:
    name: GitXCore hostless tests
    needs: toolchain-smoke
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Enforce the core dependency boundary
        run: python3 scripts/check_gitxcore_boundary.py
      - name: Run hostless core tests
        run: scripts/xcodebuild.sh --run-id "verify-core-${{ github.run_id }}-${{ github.run_attempt }}" test core
      - name: Upload core verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GitXCore-verification
          path: |
            artifacts/verification/verify-core-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            artifacts/verification/verify-core-${{ github.run_id }}-${{ github.run_attempt }}/Logs
            artifacts/verification/verify-core-${{ github.run_id }}-${{ github.run_attempt }}/Products/**/codecov/*.json

  forgekit:
    name: ForgeKit hostless tests
    needs: toolchain-smoke
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Run hostless ForgeKit tests
        run: scripts/xcodebuild.sh --run-id "verify-forgekit-${{ github.run_id }}-${{ github.run_attempt }}" test forgekit
      - name: Upload ForgeKit verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ForgeKit-verification
          path: |
            artifacts/verification/verify-forgekit-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            artifacts/verification/verify-forgekit-${{ github.run_id }}-${{ github.run_attempt }}/Logs
            artifacts/verification/verify-forgekit-${{ github.run_id }}-${{ github.run_attempt }}/Results

  static:
    name: static verification
    runs-on: macos-26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Restore pinned Swift tool cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.mint
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-mint-${{ hashFiles('Mintfile') }}
      - name: Install pinned Swift tools and workflow linters
        run: |
          brew install mint shellcheck actionlint
          mint bootstrap
      - name: Install pinned Apollo iOS codegen CLI
        run: |
          mkdir -p "$RUNNER_TEMP/apollo-ios-cli-2.3.0"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            https://github.com/apollographql/apollo-ios/releases/download/2.3.0/apollo-ios-cli.tar.gz \
            --output "$RUNNER_TEMP/apollo-ios-cli-2.3.0.tar.gz"
          echo "99ab549c51f802e76bcae751afd02dca2b2c02934b437dc885251e1c08bc65c2  $RUNNER_TEMP/apollo-ios-cli-2.3.0.tar.gz" \
            | shasum -a 256 --check
          tar \
            -xzf "$RUNNER_TEMP/apollo-ios-cli-2.3.0.tar.gz" \
            -C "$RUNNER_TEMP/apollo-ios-cli-2.3.0"
          test "$("$RUNNER_TEMP/apollo-ios-cli-2.3.0/apollo-ios-cli" --version)" = "2.3.0"
      - name: Run static checks
        env:
          APOLLO_IOS_CLI: ${{ runner.temp }}/apollo-ios-cli-2.3.0/apollo-ios-cli
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/verify_static.sh "$BASE_REF"

  unit-and-analyze:
    name: unit tests and analyzer
    needs: toolchain-smoke
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Restore pinned Swift tool cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.mint
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-mint-${{ hashFiles('Mintfile') }}
      - name: Install pinned Swift tools
        run: |
          brew install mint
          mint bootstrap
      - name: Prepare ObjectiveGit
        run: |
          cd External/objective-git
          script/bootstrap
          script/update_libgit2
      - name: Run unit and integration tests
        run: scripts/xcodebuild.sh --run-id "verify-correctness-${{ github.run_id }}-${{ github.run_attempt }}" test correctness
      - name: Run Clang static analyzer
        run: scripts/xcodebuild.sh --run-id "verify-analyze-${{ github.run_id }}-${{ github.run_attempt }}" analyze
      - name: Upload test and analyzer results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GitX-verification-results
          path: |
            artifacts/verification/*/receipt.json
            artifacts/verification/*/Logs
            artifacts/verification/*/Results

  ui:
    name: UI workflows
    needs: toolchain-smoke
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Prepare ObjectiveGit
        run: |
          cd External/objective-git
          script/bootstrap
          script/update_libgit2
      - name: Run UI plan
        run: scripts/xcodebuild.sh --run-id "verify-ui-${{ github.run_id }}-${{ github.run_attempt }}" test ui
      - name: Upload UI result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GitXUI-results
          path: |
            artifacts/verification/verify-ui-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            artifacts/verification/verify-ui-${{ github.run_id }}-${{ github.run_attempt }}/Logs
            artifacts/verification/verify-ui-${{ github.run_id }}-${{ github.run_attempt }}/Results

  sanitizers:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: toolchain-smoke
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Address and undefined behavior sanitizers
            test_plan: GitXAddressUndefined
            preset: address-undefined
          - name: Thread sanitizer
            test_plan: GitXThreadSanitizer
            preset: thread-sanitizer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Prepare ObjectiveGit
        run: |
          cd External/objective-git
          script/bootstrap
          script/update_libgit2
      - name: Run sanitizer configuration
        run: scripts/xcodebuild.sh --run-id "verify-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}" test "${{ matrix.preset }}"
      - name: Upload sanitizer result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.test_plan }}-results
          path: |
            artifacts/verification/verify-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            artifacts/verification/verify-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}/Logs
            artifacts/verification/verify-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}/Results

  performance:
    name: performance suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: toolchain-smoke
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"
      - name: Prepare ObjectiveGit
        run: |
          cd External/objective-git
          script/bootstrap
          script/update_libgit2
      - name: Run performance suite
        run: scripts/xcodebuild.sh --run-id "verify-performance-${{ github.run_id }}-${{ github.run_attempt }}" test performance
      - name: Upload performance result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GitXPerformance-results
          path: |
            artifacts/verification/verify-performance-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            artifacts/verification/verify-performance-${{ github.run_id }}-${{ github.run_attempt }}/Logs
            artifacts/verification/verify-performance-${{ github.run_id }}-${{ github.run_attempt }}/Results
